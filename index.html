<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Welcome to My Blog</h2>
            <p>Read, create and share interesting blogs.</p>
        </section>

        <section class="blogs">

            <h2>Latest Blogs</h2>

            <div class="blog-container">

                <div class="blog-card">
                    <h3>My First Blog</h3>

                    <p>
                        This is my first blog post.
                        Welcome to my blog application.
                    </p>

                    <button>Read More</button>
                </div>

                <div class="blog-card">
                    <h3>Learning Web Development</h3>

                    <p>
                        Web development is an interesting
                        and useful skill to learn.
                    </p>

                    <button>Read More</button>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 My Blog</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
